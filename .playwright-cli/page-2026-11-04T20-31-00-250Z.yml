            - paragraph [ref=e72]: 01 — QUEM SOMOS
            - heading "Gente apaixonada por viagens e especialista em milhas." [level=2] [ref=e73]
            - paragraph [ref=e74]: "A Milhas PLUS é uma empresa especializada na negociação de milhas, oferecendo uma alternativa valiosa tanto para quem compra quanto para quem vende. Nosso grande diferencial é a agilidade no processo: quem compra passagens aéreas recebe a confirmação imediata da companhia aérea, enquanto quem vende suas milhas acumuladas pode contar com o pagamento realizado em até 24 horas após a conclusão da negociação. Garantimos 100% de segurança em todas as transações."
        - generic [ref=e75]:
          - generic [ref=e76]:
            - paragraph [ref=e77]: Nossa equipe é composta por profissionais dedicados, que compartilham uma paixão por viagens e um profundo conhecimento dos programas de fidelidade. Trabalhamos em conjunto para garantir que nossos clientes tenham acesso às melhores opções disponíveis no mercado.
            - paragraph [ref=e78]: À frente da Milhas PLUS está Gunnar Ferreira, um profissional com anos de experiência e habilidade em negociações no setor de milhas. Sua expertise é fundamental para que possamos oferecer as melhores opções de passagens aéreas, sempre buscando maximizar os benefícios para nossos clientes.
            - paragraph [ref=e79]: Acreditamos que um atendimento excepcional e personalizado é fundamental. Cada viagem é única e as necessidades dos nossos clientes variam, por isso estamos sempre prontos para oferecer orientação especializada e encontrar as opções de voos que melhor atendam às preferências de cada um.
