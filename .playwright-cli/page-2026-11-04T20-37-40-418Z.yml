            - paragraph [ref=f1e61]: 01 — QUEM SOMOS
            - heading "Gente apaixonada por viagens e especialista em milhas." [level=2] [ref=f1e62]
            - paragraph [ref=f1e63]: "A Milhas PLUS é uma empresa especializada na negociação de milhas, oferecendo uma alternativa valiosa tanto para quem compra quanto para quem vende. Nosso grande diferencial é a agilidade no processo: quem compra passagens aéreas recebe a confirmação imediata da companhia aérea, enquanto quem vende suas milhas acumuladas pode contar com o pagamento realizado em até 24 horas após a conclusão da negociação. Garantimos 100% de segurança em todas as transações."
        - generic [ref=f1e64]:
          - generic [ref=f1e65]:
            - paragraph [ref=f1e66]: Nossa equipe é composta por profissionais dedicados, que compartilham uma paixão por viagens e um profundo conhecimento dos programas de fidelidade. Trabalhamos em conjunto para garantir que nossos clientes tenham acesso às melhores opções disponíveis no mercado.
            - paragraph [ref=f1e67]: Acreditamos que um atendimento excepcional e personalizado é fundamental. Cada viagem é única e as necessidades dos nossos clientes variam, por isso estamos sempre prontos para oferecer orientação especializada e encontrar as opções de voos que melhor atendam às preferências de cada um.
            - paragraph [ref=f1e68]: Estamos constantemente atualizados sobre as novidades do setor de milhas aéreas e programas de fidelidade, o que nos permite oferecer um serviço confiável e uma experiência de compra tranquila em nosso site. Valorizamos cada cliente e nos esforçamos para que sua jornada conosco seja sempre satisfatória.
          - img "Equipe da Milhas Plus sentada em um auditório, acompanhando uma palestra" [ref=f1e70]
        - generic [ref=f1e71]:
          - img "Equipe da Milhas Plus de camisetas pretas, com os braços erguidos em uma atividade na praia" [ref=f1e73]
          - generic [ref=f1e74]:
            - paragraph [ref=f1e75]: Explore nosso site e descubra como é fácil adquirir passagens aéreas utilizando milhas acumuladas por terceiros. Estamos aqui para ajudar você a economizar em suas viagens e proporcionar uma experiência agradável do início ao fim.
            - paragraph [ref=f1e76]: Agradecemos pela confiança depositada em nossa empresa e esperamos ser parte de suas próximas aventuras, tornando suas viagens ainda mais memoráveis. Estamos à disposição para esclarecer quaisquer dúvidas e garantir que você tenha uma experiência positiva ao viajar conosco.
        - generic [ref=f1e77]:
